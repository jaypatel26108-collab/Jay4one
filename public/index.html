<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jay 2.5</title>
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#14181f;--muted:#6a7383;--accent:#2347e8;--accent-ink:#fff;--bubble:#e1e6f0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--surface:#171b24;--ink:#e8ebf2;--muted:#8a93a5;--accent:#6b8cff;--accent-ink:#0f1218;--bubble:#232a38}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header{padding:16px 20px;font-weight:700;font-size:20px;letter-spacing:-.02em}
header span{color:var(--accent)}
#log{flex:1;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.j{align-self:flex-start;background:var(--bubble);border-bottom-left-radius:4px}
.empty{margin:auto;color:var(--muted);text-align:center}
form{display:flex;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
input{flex:1;font:inherit;padding:12px 16px;border-radius:24px;border:1px solid var(--bubble);background:var(--surface);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent)}
button{font:inherit;font-weight:600;padding:0 20px;border:0;border-radius:24px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header>Jay <span>2.5</span></header>
<div id="log"><div class="empty">Ask Jay anything.</div></div>
<form id="f"><input id="t" placeholder="Message Jay" autocomplete="off"><button id="b">Send</button></form>
<script>
const log=document.getElementById("log"),t=document.getElementById("t"),b=document.getElementById("b");
let history=[];
function add(role,text){
  const e=log.querySelector(".empty"); if(e) e.remove();
  const d=document.createElement("div"); d.className="m "+(role==="user"?"u":"j"); d.textContent=text;
  log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
}
document.getElementById("f").onsubmit=async(ev)=>{
  ev.preventDefault(); const text=t.value.trim(); if(!text) return;
  t.value=""; b.disabled=true; add("user",text); history.push({role:"user",content:text});
  const wait=add("assistant","…");
  try{
    const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({history})});
    const {reply}=await r.json(); wait.textContent=reply; history.push({role:"assistant",content:reply});
  }catch(err){wait.textContent="Couldn’t reach Jay. Is the server running?";}
  b.disabled=false; t.focus();
};
</script>
</body>
</html>
